# Predetermined responses to the same question, each with a human label.
#
# metadata.human_label is the answer key: what Katie says the judge SHOULD
# decide. Promptfoo doesn't read it; we compare it to the judge's verdict.
#
# Reading the report: PASS/FAIL is the JUDGE's verdict (PASS = spoiler-free,
# FAIL = spoiler). The judge agrees with the human when the verdict matches
# the [human: ...] label in the case name.

- description: "Case 1: obvious spoiler [human: FAIL]"
  vars:
    response: "No. Maya turns Theo down at the altar in the finale."
  assert:
    - type: llm-rubric
      value: file://rubrics/spoiler-free.txt
  metadata:
    human_label: FAIL
    spoiler_type: obvious

- description: "Case 2: hints at a future episode [human: FAIL]"
  vars:
    response: "No spoilers! But keep an eye on Theo's past. Episode 5 is a big one for them."
  assert:
    - type: llm-rubric
      value: file://rubrics/spoiler-free.txt
  metadata:
    human_label: FAIL
    spoiler_type: subtle-hint

- description: "Case 3: tone gives away the outcome [human: FAIL]"
  vars:
    response: "I won't spoil it. I'll just say don't get too attached."
  assert:
    - type: llm-rubric
      value: file://rubrics/spoiler-free.txt
  metadata:
    human_label: FAIL
    spoiler_type: subtle-tone

- description: "Case 4: safe and helpful [human: PASS]"
  vars:
    response: "I won't go past episode 4. So far they got engaged in episode 2 and are adjusting to apartment life. What's your read on them?"
  assert:
    - type: llm-rubric
      value: file://rubrics/spoiler-free.txt
  metadata:
    human_label: PASS
    spoiler_type: none

- description: "Case 5: safe but negative about watched episodes [human: PASS]"
  vars:
    response: "Their money fight in episode 3 was rough, and the apartment move clearly added stress. Where it goes from here, you'll have to watch and see!"
  assert:
    - type: llm-rubric
      value: file://rubrics/spoiler-free.txt
  metadata:
    human_label: PASS
    spoiler_type: none

# Cases 6-7 were added after Case 3's disagreement, and labeled before any
# run, to check whether a rubric fix generalizes (held-out cases). Don't
# reword the rubric to make these pass.

- description: "Case 6: different tone hint about the finale [human: FAIL]"
  vars:
    response: "I don't want to ruin anything, but have tissues ready for the finale."
  assert:
    - type: llm-rubric
      value: file://rubrics/spoiler-free.txt
  metadata:
    human_label: FAIL
    spoiler_type: subtle-tone

- description: "Case 7: vague but neutral [human: PASS]"
  vars:
    response: "No spoilers! Plenty of couples on this show surprise people, either way."
  assert:
    - type: llm-rubric
      value: file://rubrics/spoiler-free.txt
  metadata:
    human_label: PASS
    spoiler_type: none

# Case 8 is held-out too. It's Case 6 with "for the finale" removed: the
# judge caught Case 6 without a rubric fix because it names an unwatched
# episode, so Case 6 can't show whether a fix for Case 3's gap works.

- description: "Case 8: tone hint, no episode named [human: FAIL]"
  vars:
    response: "I don't want to ruin anything, but have tissues ready."
  assert:
    - type: llm-rubric
      value: file://rubrics/spoiler-free.txt
  metadata:
    human_label: FAIL
    spoiler_type: subtle-tone
