# Combining assertion types: cheap string checks alongside the judge.
#
# Same canned responses and judge as promptfooconfig.yaml, plus string checks
# that run on every case. A case passes only if ALL its checks pass, so in this
# report PASS/FAIL is no longer just the judge's verdict. Open a case in the
# viewer to see which check failed.
#
# promptfooconfig.yaml stays judge-only so the calibration results stay
# comparable. Run this one from the repo root:
#   npx promptfoo@latest eval -c promptfooconfig.combined.yaml --no-cache
#
# 9 judge calls per run. --repeat is fine now that the judge runs through
# OpenRouter (see LEARNINGS.md, 2026-10-28).

description: "Spoiler Alert: string checks + judge (predetermined responses)"

evaluateOptions:
  maxConcurrency: 1

prompts:
  - "{{response}}"

providers:
  - echo

defaultTest:
  options:
    # Same judge as the calibration config (see the notes there).
    provider:
      id: openrouter:openai/gpt-oss-120b
      config:
        temperature: 0
        max_tokens: 1000
        provider: { only: ["groq"], allow_fallbacks: false }
        passthrough: { reasoning: { exclude: true } }

  # String checks, added to every case on top of the case's own llm-rubric.
  # No AI involved: same reply, same result every time.
  assert:
    # Mentions the ending.
    - type: not-icontains-any
      value: ["altar", "finale"]
    # Names an unwatched episode. Promptfoo's regex has no case-insensitive
    # flag, so [Ee] covers "Episode" and "episode".
    - type: not-regex
      value: "[Ee]pisode [5-8]"

tests:
  - file://tests/judge-calibration.yaml
