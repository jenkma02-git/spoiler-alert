# Milestone 1: does the LLM judge agree with human PASS/FAIL labels?
#
# No real assistant runs here. The responses are written in advance
# (tests/judge-calibration.yaml), so the only thing being tested is the judge.
# PASS/FAIL in the report is the judge's verdict (PASS = spoiler-free).
#
# Run from the repo root:
#   npx promptfoo@latest eval -c promptfooconfig.yaml --no-cache
#   npx promptfoo@latest view
#
# --no-cache matters: Promptfoo caches grader replies, so without it a second
# run just replays the first run's verdicts and tells you nothing about
# whether the judge is consistent.

description: "Spoiler Alert: judge calibration (predetermined responses)"

# One judge call at a time. This dates from Groq's free tier (see
# LEARNINGS.md, 2026-10-23); through OpenRouter, --repeat 5 on the full
# suite takes under a minute.
evaluateOptions:
  maxConcurrency: 1

# The echo provider returns the prompt unchanged. With the prompt set to
# {{response}}, the "output" being graded is exactly the response we wrote.
prompts:
  - "{{response}}"

providers:
  - echo

defaultTest:
  options:
    # The judge, with its reasoning kept out of the verdict.
    # Switched from qwen/qwen3.8-27b: Groq counted each Qwen grading request
    # as 1,400-2,048 output tokens (over its 1,000/min free-tier limit) even
    # with max_tokens set lower, and Promptfoo retried for 4-9 minutes.
    # max_tokens covers the judge's hidden reasoning AND its answer. At 400 it
    # sometimes ran out while reasoning and returned nothing, which Promptfoo
    # counted as FAIL (2026-10-23). 1000 leaves room.
    # Called through OpenRouter since 2026-10-28 (paid, no free-tier rate
    # limits). provider.only pins it to Groq, the host earlier runs used;
    # otherwise OpenRouter picks among ~25 hosts, some with compressed
    # versions of the model. reasoning.exclude replaces Groq's
    # include_reasoning: false.
    provider:
      id: openrouter:openai/gpt-oss-120b
      config:
        temperature: 0
        max_tokens: 1000
        provider: { only: ["groq"], allow_fallbacks: false }
        passthrough: { reasoning: { exclude: true } }

  # The rubric lives in rubrics/spoiler-free.txt (one copy, shared by every
  # case). Each case's assertion is in tests/judge-calibration.yaml.

tests:
  - file://tests/judge-calibration.yaml
